name: Daily Domain Check

on:
  schedule:
    # Runs daily at 08:00 GMT+8 (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check ${{ matrix.country }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        country: [my, sg, th, np]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run country check
        env:
          RES_PROXY_MY: ${{ secrets.RES_PROXY_MY }}
          RES_PROXY_SG: ${{ secrets.RES_PROXY_SG }}
          RES_PROXY_TH: ${{ secrets.RES_PROXY_TH }}
          RES_PROXY_NP: ${{ secrets.RES_PROXY_NP }}
        run: |
          COUNTRY_PROXY=""
          case "${{ matrix.country }}" in
            my) COUNTRY_PROXY="$RES_PROXY_MY" ;;
            sg) COUNTRY_PROXY="$RES_PROXY_SG" ;;
            th) COUNTRY_PROXY="$RES_PROXY_TH" ;;
            np) COUNTRY_PROXY="$RES_PROXY_NP" ;;
          esac

          mkdir -p out
          python3 scripts/check_domains.py \
            --country "${{ matrix.country }}" \
            --list-file "lists/${{ matrix.country }}.txt" \
            --log-file "records/ban_log.csv" \
            --rows-output "out/${{ matrix.country }}_rows.csv" \
            --no-append-log \
            --proxy-url "$COUNTRY_PROXY"

      - name: Upload country artifact
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.country }}
          path: out/${{ matrix.country }}_rows.csv
          if-no-files-found: error

  aggregate_and_notify:
    name: Aggregate + Notify
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: check-*
          path: out
          merge-multiple: true

      - name: Merge logs and prepare telegram text
        id: merge
        run: |
          python3 - <<'PY'
          import csv
          import glob
          import os
          from collections import defaultdict
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          utc_today = datetime.now(timezone.utc).date()
          TODAY = utc_today.isoformat()
          LOG_FIELDS = ["date", "country", "domain", "http_code", "status"]
          COUNTRIES = ["my", "sg", "th", "np"]

          out_dir = Path("out")
          out_dir.mkdir(parents=True, exist_ok=True)
          log_path = Path("records/ban_log.csv")
          log_path.parent.mkdir(parents=True, exist_ok=True)

          if not log_path.exists() or log_path.stat().st_size == 0:
              with log_path.open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=LOG_FIELDS)
                  writer.writeheader()

          new_rows = []
          for rows_file in sorted(glob.glob("out/*_rows.csv")):
              with open(rows_file, "r", newline="", encoding="utf-8") as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      new_rows.append(
                          {
                              "date": row.get("date", TODAY),
                              "country": row.get("country", "").strip(),
                              "domain": row.get("domain", "").strip(),
                              "http_code": row.get("http_code", "").strip(),
                              "status": row.get("status", "").strip(),
                          }
                      )

          if new_rows:
              with log_path.open("a", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=LOG_FIELDS)
                  writer.writerows(new_rows)

          ban_dates = defaultdict(list)
          with log_path.open("r", newline="", encoding="utf-8") as f:
              reader = csv.DictReader(f)
              for row in reader:
                  if row.get("status") != "BAN":
                      continue
                  key = (row.get("country", ""), row.get("domain", ""))
                  try:
                      d = datetime.strptime(row.get("date", ""), "%Y-%m-%d").date()
                  except ValueError:
                      continue
                  ban_dates[key].append(d)

          today_anomalies = []
          for row in new_rows:
              if row["status"] == "BAN":
                  today_anomalies.append(row)

          unique_keys = {}
          for row in today_anomalies:
              unique_keys[(row["country"], row["domain"])] = row["http_code"]

          summary = []
          for (country, domain), http_code in sorted(unique_keys.items()):
              dates = ban_dates.get((country, domain), [])
              if not dates:
                  continue
              first_ban = min(dates).isoformat()
              c7 = sum(1 for d in dates if d >= utc_today - timedelta(days=6))
              c30 = sum(1 for d in dates if d >= utc_today - timedelta(days=29))
              c365 = sum(1 for d in dates if d >= utc_today - timedelta(days=364))
              summary.append(
                  {
                      "country": country,
                      "domain": domain,
                      "http_code": http_code,
                      "first_ban_date": first_ban,
                      "count_7d": c7,
                      "count_30d": c30,
                      "count_365d": c365,
                  }
              )

          daily_summary_file = out_dir / "telegram_daily_summary.txt"
          alert_file = out_dir / "telegram_alert.txt"

          country_title = {
              "my": "🇲🇾 Malaysia",
              "sg": "🇸🇬 Singapore",
              "th": "🇹🇭 Thailand",
              "np": "🇳🇵 Nepal",
          }

          ok_by_country = {c: [] for c in COUNTRIES}
          for row in new_rows:
              if row["status"] == "OK":
                  ok_by_country[row["country"]].append(row["domain"])
          for c in COUNTRIES:
              ok_by_country[c] = sorted(set(ok_by_country[c]))

          ban_by_country = {c: [] for c in COUNTRIES}
          for item in summary:
              ban_by_country[item["country"]].append(item)
          for c in COUNTRIES:
              ban_by_country[c] = sorted(ban_by_country[c], key=lambda x: x["domain"])

          ok_count = sum(len(ok_by_country[c]) for c in COUNTRIES)
          ban_count = len(summary)
          total_count = ok_count + ban_count

          has_anomalies = bool(summary)
          if has_anomalies:
              daily_lines = [
                  "📊 Daily Website Check Report",
                  f"Date: {TODAY}",
                  "",
                  "————————————",
                  f"🟢 Reachable ({ok_count})",
                  "————————————",
                  "",
              ]

              has_ok_items = False
              for c in COUNTRIES:
                  items = ok_by_country[c]
                  if not items:
                      continue
                  has_ok_items = True
                  daily_lines.append(country_title[c])
                  daily_lines.extend(items)
                  daily_lines.append("")
              if not has_ok_items:
                  daily_lines.append("(none)")
                  daily_lines.append("")

              daily_lines.extend(
                  [
                      "————————————",
                      f"🔴 Errors ({ban_count})",
                      "————————————",
                      "",
                  ]
              )
              if ban_count == 0:
                  daily_lines.append("(none)")
                  daily_lines.append("")
              else:
                  for c in COUNTRIES:
                      items = ban_by_country[c]
                      if not items:
                          continue
                      daily_lines.append(country_title[c])
                      for item in items:
                          daily_lines.append(f"Domain: {item['domain']}")
                      daily_lines.append("")

              daily_lines.extend(
                  [
                      "————————————",
                      f"Total: {total_count}",
                      f"🟢 Reachable: {ok_count}",
                      f"🔴 Errors: {ban_count}",
                  ]
              )
              daily_text = "\n".join(daily_lines)
              if len(daily_text) > 3900:
                  daily_text = daily_text[:3860] + "\n...(truncated)"
              daily_summary_file.write_text(daily_text, encoding="utf-8")

              alert_lines = [
                  "🚨 Website Access Anomaly Alert",
                  f"Date: {TODAY}",
                  "",
              ]
              for c in COUNTRIES:
                  items = ban_by_country[c]
                  if not items:
                      continue
                  alert_lines.append(country_title[c])
                  for item in items:
                      alert_lines.append(f"Domain: {item['domain']}")
                  alert_lines.append("")
              alert_text = "\n".join(alert_lines).strip()
              if len(alert_text) > 3900:
                  alert_text = alert_text[:3860] + "\n...(truncated)"
              alert_file.write_text(alert_text, encoding="utf-8")
          else:
              daily_summary_file.write_text("", encoding="utf-8")
              alert_file.write_text("", encoding="utf-8")

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as f:
              f.write(f"log_changed={'true' if bool(new_rows) else 'false'}\n")
              f.write(f"has_anomalies={'true' if has_anomalies else 'false'}\n")
          PY

      - name: Send Telegram notification
        if: steps.merge.outputs.has_anomalies == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "TG_BOT_TOKEN or TG_CHAT_ID is not configured. Skip notification."
            exit 0
          fi
          DAILY_MESSAGE="$(cat out/telegram_daily_summary.txt)"
          ALERT_MESSAGE="$(cat out/telegram_alert.txt)"
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${DAILY_MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${ALERT_MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null

      - name: Commit ban log
        if: steps.merge.outputs.log_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records/ban_log.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: append ban_log.csv for $(date -u +%F)"
          git push
